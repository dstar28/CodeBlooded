<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SafeGuard — Zone Admin</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

<style>
  :root{
    --bg:#0b1220;
    --panel:#11192c;
    --panel-border:#22304d;
    --text:#e8edf7;
    --muted:#8fa0c2;
    --accent:#3fb6e6;
    --danger:#ef4d5f;
    --danger-surface:#3a1620;
    --warning:#f2a93b;
    --safe:#3ecf8e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid;
    grid-template-columns:360px 1fr;
    grid-template-rows:56px 1fr;
    grid-template-areas:"header header" "sidebar map";
    height:100vh;
  }
  header{
    grid-area:header;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--panel-border);
    background:var(--panel);
  }
  header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em;}
  header .status{font-size:12px;color:var(--muted);}
  header .status.ok::before{content:"● ";color:var(--safe);}
  header .status.err::before{content:"● ";color:var(--danger);}

  #sidebar{
    grid-area:sidebar;
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    overflow-y:auto;
    padding:16px;
  }
  #map{grid-area:map;background:#0e1526;}

  section{margin-bottom:22px;}
  section h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 0 10px;
  }
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 10px;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field input,.field select{
    width:100%;padding:8px 10px;border-radius:8px;
    border:1px solid var(--panel-border);background:#0e1526;color:var(--text);
    font-size:13px;
  }

  button{
    cursor:pointer;border:none;border-radius:8px;
    padding:9px 12px;font-size:13px;font-weight:600;
    transition:filter .15s ease;
  }
  button:hover{filter:brightness(1.12);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#04202e;width:100%;}
  .btn-approve{background:var(--safe);color:#04231a;}
  .btn-reject{background:var(--danger);color:#2b0308;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--panel-border);}

  .zone-card{
    border:1px solid var(--panel-border);border-radius:10px;
    padding:10px;margin-bottom:8px;background:#0e1526;
  }
  .zone-card .name{font-size:13px;font-weight:600;}
  .zone-card .meta{font-size:11px;color:var(--muted);margin:2px 0 8px;}
  .zone-card .row{display:flex;gap:8px;}
  .zone-card .row button{flex:1;}
  .badge{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;
    padding:2px 6px;border-radius:5px;text-transform:uppercase;margin-left:6px;
  }
  .badge.ai{background:#2a2140;color:#c9b6ff;}
  .badge.admin{background:#12314a;color:var(--accent);}

  .empty{font-size:12px;color:var(--muted);font-style:italic;padding:6px 0;}
  .leaflet-container{font-family:inherit;}
</style>
</head>
<body>

<header>
  <h1>SafeGuard — Zone Admin</h1>
  <span id="conn-status" class="status">checking backend…</span>
</header>

<div id="sidebar">
  <section>
    <h2>Draw a zone</h2>
    <p class="hint">Use the polygon or circle tool on the map, then fill this in and save. New zones are proposed only — they go live after you approve them below.</p>
    <div class="field">
      <label for="zone-name">Zone name</label>
      <input id="zone-name" type="text" placeholder="e.g. Riverside Market — after dark" />
    </div>
    <div class="field">
      <label for="zone-risk">Risk level</label>
      <select id="zone-risk">
        <option value="danger">Danger</option>
        <option value="warning">Warning</option>
      </select>
    </div>
    <button id="save-zone" class="btn-primary" disabled>Draw a shape on the map first</button>
  </section>

  <section>
    <h2>Pending review</h2>
    <div id="pending-list"><p class="empty">Loading…</p></div>
  </section>

  <section>
    <h2>Active zones</h2>
    <div id="active-list"><p class="empty">Loading…</p></div>
  </section>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

<script>
// Same-origin backend (this page is served BY the FastAPI app at /admin).
const API_BASE = window.location.origin;
const ADMIN_ID = "admin-dashboard-user"; // placeholder until real admin auth exists

const map = L.map('map').setView([12.9716, 77.5946], 12); // default: Bengaluru; recenter as needed
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

const drawnItems = new L.FeatureGroup().addTo(map);
const pendingLayer = new L.FeatureGroup().addTo(map);
const activeLayer = new L.FeatureGroup().addTo(map);

const drawControl = new L.Control.Draw({
  edit: { featureGroup: drawnItems, remove: true },
  draw: {
    polygon: { shapeOptions: { color: '#ef4d5f' } },
    circle: { shapeOptions: { color: '#ef4d5f' } },
    rectangle: false,
    polyline: false,
    marker: false,
    circlemarker: false,
  },
});
map.addControl(drawControl);

const saveBtn = document.getElementById('save-zone');
let currentLayer = null;

map.on(L.Draw.Event.CREATED, (e) => {
  drawnItems.clearLayers();
  currentLayer = e.layer;
  drawnItems.addLayer(currentLayer);
  saveBtn.disabled = false;
  saveBtn.textContent = 'Save proposed zone';
});
map.on(L.Draw.Event.DELETED, () => {
  currentLayer = null;
  saveBtn.disabled = true;
  saveBtn.textContent = 'Draw a shape on the map first';
});

/**
 * Turf.js does the geometry work here: turns whatever Leaflet drew into
 * clean GeoJSON, and (for a circle) uses turf.circle to precompute an
 * actual polygon buffer so admins can preview the true covered area,
 * even though the backend stores circles as {center, radius_m} and
 * recomputes the same buffer server-side with Shapely when needed.
 */
function layerToZonePayload(layer) {
  if (layer instanceof L.Circle) {
    const center = layer.getLatLng();
    const radius_m = layer.getRadius();
    // Turf.js circle-to-polygon, purely for the live map preview.
    const previewPolygon = turf.circle([center.lng, center.lat], radius_m / 1000, { units: 'kilometers', steps: 48 });
    L.geoJSON(previewPolygon, { style: { color: '#ef4d5f', dashArray: '4 4', fill: false } }).addTo(drawnItems);
    return {
      geometry_type: 'Circle',
      geometry: { center: [center.lng, center.lat], radius_m },
    };
  }
  // Polygon: Leaflet -> GeoJSON directly (this already IS the Leaflet/Turf
  // common format).
  const geojson = layer.toGeoJSON();
  return {
    geometry_type: 'Polygon',
    geometry: geojson.geometry,
  };
}

saveBtn.addEventListener('click', async () => {
  if (!currentLayer) return;
  const name = document.getElementById('zone-name').value.trim();
  if (!name) { alert('Give the zone a name first.'); return; }
  const risk_level = document.getElementById('zone-risk').value;
  const { geometry_type, geometry } = layerToZonePayload(currentLayer);

  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  try {
    const res = await fetch(`${API_BASE}/geofences/propose`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name, risk_level, geometry_type, geometry,
        source: 'admin', created_by: ADMIN_ID,
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    drawnItems.clearLayers();
    currentLayer = null;
    document.getElementById('zone-name').value = '';
    saveBtn.textContent = 'Draw a shape on the map first';
    await refreshAll();
  } catch (err) {
    alert('Could not save zone: ' + err.message);
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save proposed zone';
  }
});

function styleForFeature(feature) {
  const risk = feature.properties.risk_level;
  const color = risk === 'warning' ? '#f2a93b' : '#ef4d5f';
  return { color, weight: 2, fillColor: color, fillOpacity: feature.properties.active ? 0.25 : 0.08 };
}

function featureToLayer(feature) {
  // Circles are stored/sent as a Point + radius_m property (see
  // geofences.py._zone_to_geojson_feature) — Turf.js buffers it back
  // into a polygon for display so it renders identically to a real
  // Polygon zone.
  if (feature.geometry.type === 'Point' && feature.properties.radius_m) {
    const [lon, lat] = feature.geometry.coordinates;
    const poly = turf.circle([lon, lat], feature.properties.radius_m / 1000, { units: 'kilometers', steps: 48 });
    poly.properties = feature.properties;
    poly.id = feature.id;
    return L.geoJSON(poly, { style: styleForFeature });
  }
  return L.geoJSON(feature, { style: styleForFeature });
}

async function fetchJSON(path, opts) {
  const res = await fetch(`${API_BASE}${path}`, opts);
  if (!res.ok) throw new Error(`${path} -> ${res.status}`);
  return res.json();
}

async function decide(zoneId, action, btn) {
  btn.disabled = true;
  try {
    await fetchJSON(`/geofences/${zoneId}/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_id: ADMIN_ID }),
    });
    await refreshAll();
  } catch (err) {
    alert('Action failed: ' + err.message);
    btn.disabled = false;
  }
}

function renderPending(fc) {
  pendingLayer.clearLayers();
  const list = document.getElementById('pending-list');
  if (!fc.features.length) {
    list.innerHTML = '<p class="empty">No zones awaiting review.</p>';
    return;
  }
  list.innerHTML = '';
  fc.features.forEach((f) => {
    featureToLayer(f).addTo(pendingLayer);

    const card = document.createElement('div');
    card.className = 'zone-card';
    card.innerHTML = `
      <div class="name">${f.properties.name}<span class="badge ${f.properties.source}">${f.properties.source === 'ai' ? 'AI suggested' : 'Admin'}</span></div>
      <div class="meta">${f.properties.risk_level} · not yet active</div>
      <div class="row">
        <button class="btn-approve" data-action="approve">Approve</button>
        <button class="btn-reject" data-action="reject">Reject</button>
      </div>`;
    card.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => decide(f.id, btn.dataset.action, btn));
    });
    list.appendChild(card);
  });
}

function renderActive(fc) {
  activeLayer.clearLayers();
  const list = document.getElementById('active-list');
  if (!fc.features.length) {
    list.innerHTML = '<p class="empty">No active zones.</p>';
    return;
  }
  list.innerHTML = '';
  fc.features.forEach((f) => {
    featureToLayer(f).addTo(activeLayer);

    const card = document.createElement('div');
    card.className = 'zone-card';
    card.innerHTML = `
      <div class="name">${f.properties.name}</div>
      <div class="meta">${f.properties.risk_level} · live</div>
      <div class="row"><button class="btn-ghost" data-action="deactivate">Deactivate</button></div>`;
    card.querySelector('button').addEventListener('click', async (e) => {
      e.target.disabled = true;
      try {
        await fetchJSON(`/geofences/${f.id}/deactivate`, { method: 'POST' });
        await refreshAll();
      } catch (err) {
        alert('Could not deactivate: ' + err.message);
        e.target.disabled = false;
      }
    });
    list.appendChild(card);
  });
}

async function refreshAll() {
  try {
    const [pending, active] = await Promise.all([
      fetchJSON('/geofences/pending'),
      fetchJSON('/geofences/active'),
    ]);
    renderPending(pending);
    renderActive(active);
    setStatus(true);
  } catch (err) {
    setStatus(false);
  }
}

function setStatus(ok) {
  const el = document.getElementById('conn-status');
  el.className = 'status ' + (ok ? 'ok' : 'err');
  el.textContent = ok ? 'Backend connected' : 'Backend unreachable';
}

refreshAll();
setInterval(refreshAll, 15000);
</script>
</body>
</html>
